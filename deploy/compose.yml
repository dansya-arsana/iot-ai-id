name: iot-ai-release
services:
  api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/iot-ai-id/secrets/provider.env
      - /opt/iot-ai-id/secrets/coordinator.env
      - /opt/iot-ai-id/secrets/knowledge.env
      - /opt/iot-ai-id/secrets/ops.env
    environment:
      API_BIND: 0.0.0.0
      API_PORT: 8787
      WEB_PORT: 8787
      IOT_DB_PATH: /data/iot.sqlite
      IOT_RUNTIME_BUILDS_PATH: /data/builds
      IOT_AGENT_PROVIDER: jev
      IOT_DEPLOYMENT: cloud
      IOT_VAULT_KEY_FILE: /run/secrets/vault.key
      JEV_CODEX_BIN: /work/jev/jev-codex
      OPENVIKING_URL: http://knowledge:1933
      IOT_COORDINATOR_URL: http://coordinator:8790
      OPS_URL: http://ops:8791
    volumes:
      - iot_data:/data
      - /opt/iot-ai-id/secrets/vault.key:/run/secrets/vault.key:ro
    networks:
      gateway:
        aliases: [iot-ai-api]
      knowledge: {}
      ops: {}
  coordinator:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    command: node --import tsx services/coordinator/server.ts
    restart: unless-stopped
    env_file: /opt/iot-ai-id/secrets/coordinator.env
    environment:
      IOT_COORDINATOR_HOST: 0.0.0.0
      IOT_COORDINATOR_PORT: 8790
      IOT_COORDINATOR_DB: /data/coordinator.sqlite
    volumes:
      - coordinator_data:/data
    networks:
      gateway:
        aliases: [iot-ai-coordinator]
  ops:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    command: node --import tsx services/ops/server.ts
    restart: unless-stopped
    env_file: /opt/iot-ai-id/secrets/ops.env
    environment:
      OPS_HOST: 0.0.0.0
      OPS_PORT: 8791
      OPS_DB: /data/ops.sqlite
    volumes:
      - ops_data:/data
    networks:
      gateway:
        aliases: [iot-ai-ops]
      ops: {}
  knowledge:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.knowledge
    restart: unless-stopped
    volumes:
      - knowledge_data:/data
      - /opt/iot-ai-id/secrets/knowledge.json:/conf/knowledge.json:ro
    networks: [knowledge]

networks:
  gateway:
    external: true
    name: prod-client_default
  knowledge: {}
  ops: {}
volumes:
  iot_data:
  coordinator_data:
  knowledge_data:
  ops_data:
