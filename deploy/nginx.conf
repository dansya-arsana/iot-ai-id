map $http_origin $iot_origin_allowed {
    default 0;
    "" 1;
    "https://iot.ai.id" 1;
    "https://admin.iot.ai.id" 1;
    "https://api.iot.ai.id" 1;
}
# Public inquiry form: per-visitor rate (Cloudflare client IP), on top of the ops service's own per-IP and global caps.
limit_req_zone $http_cf_connecting_ip zone=iot_ops_intake:1m rate=6r/m;
map "$http_cf_ipcountry:$cookie_iot_region" $iot_geo_redirect {
    default 0;
    "ID:" 1;
}
server {
    listen 80;
    server_name iot.ai.id admin.iot.ai.id api.iot.ai.id edge.iot.ai.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    if ($iot_origin_allowed = 0) { return 403; }
    location = /backoffice { return 302 https://admin.iot.ai.id/; }
    root /var/www/certbot/iot-web;
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Vary "CF-IPCountry, Cookie" always;
        if ($iot_geo_redirect) { return 302 /id/$is_args$args; }
        try_files /index.html =404;
    }
    # Ops service public surface only: inquiry form (POST), catalog and Lab Mitra board (GET). Admin routes stay internal.
    location = /ops/v1/inquiries {
        limit_req zone=iot_ops_intake burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /ops/v1/admin/ { default_type application/json; return 404 '{"error":"Not found"}'; }
    location /ops/v1/ {
        limit_except GET { deny all; }
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /api/ {
        default_type application/json;
        return 403 '{"error":"Workspace publik belum tersedia. Gunakan aplikasi desktop atau workspace admin dengan akses pemilik."}';
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name admin.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    auth_basic "IOT AI ID testing workspace";
    auth_basic_user_file /etc/nginx/conf.d/iot-users.htpasswd;
    if ($iot_origin_allowed = 0) { return 403; }
    location = /backoffice { return 301 /; }
    root /var/www/certbot/iot-web;
    location /api/ {
        set $upstream http://iot-ai-api:8787;
        proxy_pass $upstream;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin http://127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    auth_basic "IOT AI ID testing workspace";
    auth_basic_user_file /etc/nginx/conf.d/iot-users.htpasswd;
    if ($iot_origin_allowed = 0) { return 403; }
    location / {
        set $upstream http://iot-ai-api:8787;
        proxy_pass $upstream;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin http://127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name edge.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    location / {
        set $upstream http://iot-ai-coordinator:8790;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
