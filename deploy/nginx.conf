map $http_origin $iot_origin_allowed {
    default 0;
    "" 1;
    "https://iot.ai.id" 1;
    "https://admin.iot.ai.id" 1;
    "https://api.iot.ai.id" 1;
}
# Public inquiry form: per-visitor rate (Cloudflare client IP), on top of the ops service's own per-IP and global caps.
limit_req_zone $http_cf_connecting_ip zone=iot_ops_intake:1m rate=6r/m;
# School portal (ADR 010): general API and, stricter, login and activation. Keyed on the Cloudflare client IP, falling back to the socket address when the header is missing.
map $http_cf_connecting_ip $iot_client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
limit_req_zone $iot_client_ip zone=iot_portal:1m rate=60r/m;
limit_req_zone $iot_client_ip zone=iot_portal_auth:1m rate=5r/m;
# Admin host staff login: strict zone for exact login and activate.
limit_req_zone $iot_client_ip zone=iot_staff_auth:1m rate=5r/m;
map "$http_cf_ipcountry:$cookie_iot_region" $iot_geo_redirect {
    default 0;
    "ID:" 1;
}
server {
    listen 80;
    server_name iot.ai.id admin.iot.ai.id api.iot.ai.id edge.iot.ai.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    if ($iot_origin_allowed = 0) { return 403; }
    location = /backoffice { return 302 https://admin.iot.ai.id/; }
    root /var/www/certbot/iot-web;
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Vary "CF-IPCountry, Cookie" always;
        if ($iot_geo_redirect) { return 302 /id/$is_args$args; }
        try_files /index.html =404;
    }
    # Ops service public surface only: inquiry form (POST), catalog and Lab Mitra board (GET). Admin routes stay internal.
    location = /ops/v1/inquiries {
        limit_req zone=iot_ops_intake burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    # School portal: cookie session API, all methods. Login and activation get the strict zone.
    location = /ops/v1/portal/login {
        limit_req zone=iot_portal_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location = /ops/v1/portal/activate {
        limit_req zone=iot_portal_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /ops/v1/portal/ {
        limit_req zone=iot_portal burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    # Member accounts (ADR 009 addendum): cookie session API for invited clients; login and activation get the strict zone.
    location = /ops/v1/member/login {
        limit_req zone=iot_portal_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location = /ops/v1/member/activate {
        limit_req zone=iot_portal_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /ops/v1/member/ {
        limit_req zone=iot_portal burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /ops/v1/admin/ { default_type application/json; return 404 '{"error":"Not found"}'; }
    location /ops/v1/staff/ { default_type application/json; return 404 '{"error":"Not found"}'; }
    location /ops/v1/ {
        limit_except GET { deny all; }
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /api/ {
        default_type application/json;
        return 403 '{"error":"Workspace publik belum tersedia. Gunakan aplikasi desktop atau workspace admin dengan akses pemilik."}';
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name admin.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    if ($iot_origin_allowed = 0) { return 403; }
    location = /backoffice { return 301 /; }
    root /var/www/certbot/iot-web;
    # Staff login: every /api/ call must carry a valid aiot_admin session. The ops service answers 204 (user and role in headers) or 401.
    location = /_staff_check {
        internal;
        set $staff_check http://iot-ai-ops:8791/ops/v1/staff/check;
        proxy_pass $staff_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $iot_client_ip;
    }
    location /api/ {
        auth_request /_staff_check;
        auth_request_set $staff_user $upstream_http_x_staff_user;
        set $upstream http://iot-ai-api:8787;
        proxy_pass $upstream;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin http://127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_set_header X-Remote-User $staff_user;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
    # Staff auth routes are public on this host, except check, which only nginx may call internally.
    location = /ops/v1/staff/check { default_type application/json; return 404 '{"error":"Not found"}'; }
    location = /ops/v1/staff/login {
        limit_req zone=iot_staff_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location = /ops/v1/staff/activate {
        limit_req zone=iot_staff_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location /ops/v1/staff/ {
        limit_req zone=iot_portal burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        set $upstream http://iot-ai-ops:8791;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $iot_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Ops-User "";
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    auth_basic "IOT AI ID testing workspace";
    auth_basic_user_file /etc/nginx/conf.d/iot-users.htpasswd;
    if ($iot_origin_allowed = 0) { return 403; }
    location / {
        set $upstream http://iot-ai-api:8787;
        proxy_pass $upstream;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin http://127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name edge.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    location / {
        set $upstream http://iot-ai-coordinator:8790;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
