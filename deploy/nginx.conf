map $http_origin $iot_origin_allowed {
    default 0;
    "" 1;
    "https://iot.ai.id" 1;
    "https://admin.iot.ai.id" 1;
    "https://api.iot.ai.id" 1;
}
server {
    listen 80;
    server_name iot.ai.id admin.iot.ai.id api.iot.ai.id edge.iot.ai.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    if ($iot_origin_allowed = 0) { return 403; }
    location = /backoffice { return 302 https://admin.iot.ai.id/; }
    root /var/www/certbot/iot-web;
    location /api/ {
        default_type application/json;
        return 403 '{"error":"Workspace publik belum tersedia. Gunakan aplikasi desktop atau workspace admin dengan akses pemilik."}';
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name admin.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    auth_basic "IOT AI ID testing workspace";
    auth_basic_user_file /etc/nginx/conf.d/iot-users.htpasswd;
    if ($iot_origin_allowed = 0) { return 403; }
    location = / { return 302 /backoffice; }
    root /var/www/certbot/iot-web;
    location /api/ {
        set $upstream http://iot-ai-api:8787;
        proxy_pass $upstream;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin http://127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    auth_basic "IOT AI ID testing workspace";
    auth_basic_user_file /etc/nginx/conf.d/iot-users.htpasswd;
    if ($iot_origin_allowed = 0) { return 403; }
    location / {
        set $upstream http://iot-ai-api:8787;
        proxy_pass $upstream;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin http://127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name edge.iot.ai.id;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    ssl_certificate /etc/letsencrypt/live/iot-ai-release/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-ai-release/privkey.pem;
    location / {
        set $upstream http://iot-ai-coordinator:8790;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
